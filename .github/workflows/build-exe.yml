name: Build exe
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - run: pyinstaller --noconsole --onefile --clean --name UebanLauncher launcher.py
      - uses: actions/upload-artifact@v4
        with:
          name: UebanLauncher
          path: dist/UebanLauncher.exe
